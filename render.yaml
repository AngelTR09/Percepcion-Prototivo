# Blueprint de Render (plan gratis): New + Blueprint, y elegir este repositorio. Crea 4 servicios web separados.
# Las URLs de abajo deben ser las REALES de cada servicio: Render agrega un sufijo al nombre cuando ya esta en uso
# (aqui -hrnc). Si al aplicar el Blueprint te da otro sufijo, cambialo en las 6 URLs y haz Manual sync.
# VIDEO y PREDICCION cargan YOLO (~250 MB cada uno): en el plan gratis (512 MB) caben justo y se duermen tras ~15 min sin visitas.
services:
  - type: web
    name: supervision-video
    runtime: docker
    dockerfilePath: ./servicios/video/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /salud
    envVars:
      - {key: IMAGEN_URL, value: "https://supervision-imagen-hrnc.onrender.com"}

  - type: web
    name: supervision-imagen
    runtime: docker
    dockerfilePath: ./servicios/imagen/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /salud
    envVars:
      - {key: VIDEO_URL, value: "https://supervision-video-hrnc.onrender.com"}
      - {key: PREDICCION_URL, value: "https://supervision-prediccion-hrnc.onrender.com"}

  - type: web
    name: supervision-prediccion
    runtime: docker
    dockerfilePath: ./servicios/prediccion/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /salud

  - type: web
    name: supervision-portal
    runtime: docker
    dockerfilePath: ./servicios/portal/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /salud
    envVars:
      - {key: URL_VIDEO, value: "https://supervision-video-hrnc.onrender.com"}
      - {key: URL_IMAGEN, value: "https://supervision-imagen-hrnc.onrender.com"}
      - {key: URL_PREDICCION, value: "https://supervision-prediccion-hrnc.onrender.com"}
