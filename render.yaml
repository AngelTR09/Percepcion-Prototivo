# Blueprint de Render (plan GRATIS): New + > Blueprint, y elegir este repositorio. Construye el Dockerfile de la raiz.
#
# Memoria medida en el contenedor Linux con tope duro de 512 MiB: 384 MiB (75 %) tras 10 imagenes seguidas, sin OOM.
# Cabe, pero justo. El plan free ademas tiene CPU compartida (la primera peticion carga YOLO y puede tardar decenas de
# segundos) y el servicio se duerme tras ~15 min sin visitas. Para mas holgura, Hugging Face Spaces (16 GB): deploy/publicar_huggingface.py.
# Si el servicio se reinicia por falta de memoria: INTEGRADO_DETECTOR=off (el panel y PREDICCION siguen; la cadena responde 503).
services:
  - type: web
    name: supervision-inteligente
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /salud
    autoDeploy: true                # solo redespliega lo que llega a main (protegida: solo via Pull Request)
    envVars:
      - key: INTEGRADO_DETECTOR
        value: video                # cadena completa; "off" apaga YOLO y ahorra ~250 MB
      - key: FRONTEND_ORIGINS
        value: https://supervision-inteligente.onrender.com
