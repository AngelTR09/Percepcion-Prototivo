# Blueprint de Render: New + > Blueprint, y elegir este repositorio. Construye el Dockerfile de la raiz.
services:
  - type: web
    name: supervision-inteligente
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard                  # medido: ~590 MB con YOLO cargado; el plan free (512 MB) solo sirve con INTEGRADO_DETECTOR=off
    healthCheckPath: /salud
    autoDeploy: true                # solo redespliega lo que llega a main (protegida: solo via Pull Request)
    envVars:
      - key: INTEGRADO_DETECTOR
        value: video                # "off" para desactivar YOLO y ahorrar memoria
      - key: FRONTEND_ORIGINS
        value: https://supervision-inteligente.onrender.com
