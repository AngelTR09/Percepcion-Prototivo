# Uso en el aula, con cámara USB:  docker compose up -d --build   ->  http://localhost:8000
services:
  aula:
    build: .
    restart: unless-stopped
    ports: ["8000:8000"]
    devices: ["/dev/video0:/dev/video0"]
    group_add: [video]
    environment:
      FUENTE: ${FUENTE:-0}                    # 0 = USB, o rtsp://usuario:clave@ip:554/stream
      PANEL_USUARIO: ${PANEL_USUARIO:-docente}
      PANEL_CLAVE: ${PANEL_CLAVE:-docente123}
      VISTA_PREVIA: ${VISTA_PREVIA:-0}          # 1 = vista previa anonimizada en el panel local
    volumes: ["./datos:/datos"]
