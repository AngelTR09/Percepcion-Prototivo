# DEMOSTRACIÓN sin cámara: usa demo/aula_demo.mp4 (imágenes reales del dataset).
#   docker compose -f docker-compose.demo.yml up --build     ->  http://localhost:8000
services:
  aula:
    build: .
    ports: ["8000:8000"]
    environment:
      FUENTE: /demo/aula_demo.mp4
      INTERVALO_S: "10"                       # un indicador cada 10 s para verlo enseguida (en el aula real son 60 s)
      PANEL_USUARIO: docente
      PANEL_CLAVE: ${PANEL_CLAVE:-docente123}
      VISTA_PREVIA: ${VISTA_PREVIA:-1}          # vista previa anonimizada en el panel local
    volumes: ["./demo:/demo:ro", "./datos:/datos"]
